[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "scan2canon"
version = "0.1.0"
description = "Real-world object capture and canonicalization pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pillow>=11,<13",
  "pillow-heif>=1,<2",
  "pydantic>=2.10,<3",
  "uvicorn>=0.34,<1",
]

[project.scripts]
scan2canon = "scan2canon.cli:main"

[dependency-groups]
dev = ["httpx2", "mypy>=1.15,<2", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/scan2canon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".uv-cache", ".scan2canon", "data", "weights"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["huggingface_hub", "mapanything.*", "numpy", "torch", "trimesh"]
ignore_missing_imports = true
