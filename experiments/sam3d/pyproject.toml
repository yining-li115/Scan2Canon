[project]
name = "scan2canon-sam3d-experiment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.5.1", "torchvision==0.20.1", "torchaudio==2.5.1",
  "numpy==1.26.4", "pillow>=11,<12", "huggingface-hub==0.35.3",
  "hydra-core==1.3.2", "lightning==2.3.3", "loguru==0.7.2",
  "timm==0.9.16", "spconv-cu121==2.3.8", "xformers==0.0.28.post3",
  "open3d==0.18.0", "opencv-python==4.9.0.80", "optree==0.14.1",
  "pymeshfix==0.17.0", "igraph==0.11.8", "xatlas==0.0.9",
  "easydict==1.13", "einops", "einops-exts==0.0.4", "safetensors", "astor==0.8.1",
  "trimesh", "plyfile", "scipy", "matplotlib", "plotly", "imageio[ffmpeg]",
  "seaborn==0.13.2", "gradio==5.49.0", "ipython", "ipywidgets",
  "transformers==4.51.3", "MoGe", "kaolin==0.17.0", "warp-lang==1.6.0",
  "setuptools<81", "wheel", "ninja", "packaging", "fvcore", "jaxtyping", "rich",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
xformers = { index = "pytorch-cu121" }
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "a8c37341bc0325ca99b9d57981cc3bb2bd3e255b" }
kaolin = { url = "https://nvidia-kaolin.s3.us-east-2.amazonaws.com/torch-2.5.1_cu121/kaolin-0.17.0-cp311-cp311-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.scan2canon]
source_revision = "f91db411c50efee93d8db7aeb323885650f6f722"
checkpoint = "facebook/sam-3d-objects"
checkpoint_revision = "2e73555018d2741ccd486e56c24fac41155a1dc6"
checkpoint_license = "SAM License"
pytorch3d_revision = "75ebeeaea0908c5527e7b1e305fbc7681382db47"
gsplat_revision = "2323de5905d5e90e035f792fe65bad0fedd413e7"
flash_attn_version = "2.8.3"
