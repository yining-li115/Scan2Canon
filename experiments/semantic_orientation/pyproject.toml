[project]
name = "scan2canon-semantic-orientation-experiment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "numpy==1.26.4",
  "transformers==4.49.0", "accelerate==1.6.0", "huggingface-hub==0.35.3",
  "qwen-vl-utils==0.0.8", "timm==0.6.13", "easydict==1.13", "pyyaml==6.0.2",
  "ftfy==6.3.1", "regex>=2024.11", "plyfile==1.1.2", "setuptools==69.5.1",
  "pydantic>=2.10,<3", "trimesh>=4.6,<5", "scipy>=1.15,<1.16",
  "networkx>=3.4,<4", "pillow>=11,<12", "tqdm>=4.67,<5", "termcolor==2.5.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.scan2canon]
source_repository = "https://github.com/qizekun/SoFar.git"
source_revision = "bdbf6f5af7f2a33e5f506ebda057342459731cf5"
pointso_repository = "qizekun/PointSO"
pointso_revision = "f0cf072b4c436b1d72c34ac9482dc4dc23e108b7"
pointso_file = "small.pth"
vlm_repository = "Qwen/Qwen2.5-VL-7B-Instruct"
vlm_revision = "cc594898137f460bfe9f0759e9844b3ce807cfb5"
