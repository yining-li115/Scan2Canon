name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --locked --extra canonical
      - run: uv run --locked --extra canonical ruff check .
      - run: uv run --locked --extra canonical ruff format --check .
      - run: uv run --locked --extra canonical mypy src tests experiments
      - run: uv run --locked --extra canonical pytest
